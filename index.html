<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side Scrolling Mario Game</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#87CEEB;
    font-family:Arial,sans-serif;
}

#game{
    width:100vw;
    height:100vh;
    overflow:hidden;
    position:relative;
}

#world{
    position:absolute;
    width:3200px;
    height:100vh;
}

#ground{
    position:absolute;
    left:0;
    bottom:0;
    width:3200px;
    height:80px;
    background:#45a049;
}

#mario{
    position:absolute;
    width:40px;
    height:50px;
    background:red;
    border-radius:8px;
    z-index:100;
}

.platform{
    position:absolute;
    background:#8B4513;
}

.movingPlatform{
    position:absolute;
    background:#A0522D;
    border:2px solid #5C3317;
}

.enemy{
    position:absolute;
    width:40px;
    height:40px;
    background:purple;
}

.coin{
    position:absolute;
    width:20px;
    height:20px;
    border-radius:50%;
    background:gold;
    border:2px solid orange;
}

.pit{
    position:absolute;
    bottom:0;
    height:80px;
    background:black;
}

#castle{
    position:absolute;
    width:120px;
    height:180px;
    background:#777;
    border:4px solid #444;
    bottom:80px;
    left:3050px;
}

#castle:before{
    content:"";
    position:absolute;
    width:40px;
    height:60px;
    background:#333;
    bottom:0;
    left:40px;
}

#ui{
    position:fixed;
    top:10px;
    left:10px;
    color:white;
    font-size:24px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
    z-index:1000;
}

#message{
    position:fixed;
    top:40%;
    width:100%;
    text-align:center;
    color:white;
    font-size:60px;
    text-shadow:3px 3px 6px black;
    display:none;
    z-index:2000;
}
</style>
</head>
<body>

<div id="ui">
Score: <span id="score">0</span>
&nbsp;&nbsp;
Time: <span id="timer">180</span>
</div>

<div id="message"></div>

<div id="game">
<div id="world">

<div id="ground"></div>
<div id="mario"></div>

<!-- Pits -->
<div class="pit" style="left:600px;width:120px;"></div>
<div class="pit" style="left:1300px;width:150px;"></div>
<div class="pit" style="left:2200px;width:180px;"></div>

<!-- Platforms -->
<div class="platform" style="left:300px;top:500px;width:150px;height:20px;"></div>
<div class="platform" style="left:850px;top:420px;width:150px;height:20px;"></div>
<div class="platform" style="left:1600px;top:360px;width:150px;height:20px;"></div>
<div class="platform" style="left:2500px;top:300px;width:180px;height:20px;"></div>

<!-- Moving Platforms -->
<div id="mp1" class="movingPlatform" style="left:1050px;top:300px;width:140px;height:20px;"></div>
<div id="mp2" class="movingPlatform" style="left:1900px;top:260px;width:140px;height:20px;"></div>

<!-- Coins -->
<div class="coin" style="left:350px;top:450px;"></div>
<div class="coin" style="left:400px;top:450px;"></div>
<div class="coin" style="left:900px;top:370px;"></div>
<div class="coin" style="left:1100px;top:250px;"></div>
<div class="coin" style="left:1650px;top:310px;"></div>
<div class="coin" style="left:1950px;top:210px;"></div>
<div class="coin" style="left:2550px;top:250px;"></div>
<div class="coin" style="left:2900px;top:500px;"></div>

<!-- Enemies -->
<div class="enemy" style="left:500px;top:640px;"></div>
<div class="enemy" style="left:1200px;top:640px;"></div>
<div class="enemy" style="left:1800px;top:640px;"></div>
<div class="enemy" style="left:2700px;top:640px;"></div>

<div id="castle"></div>

</div>
</div>

<div id="audioHint" style="position:fixed;bottom:10px;left:10px;color:white;font-size:14px;">
Press any key to start BGM
</div>

<script>

const mario=document.getElementById("mario");
const world=document.getElementById("world");
const message=document.getElementById("message");

let x=50;
let y=window.innerHeight-130;

let vx=0;
let vy=0;

let score=0;
let gameOver=false;
let won=false;

const gravity=0.7;
const speed=6;
const jumpPower=-15;

const keys={};

const enemies=[...document.querySelectorAll(".enemy")];
const platforms=[...document.querySelectorAll(".platform")];
const movingPlatforms=[...document.querySelectorAll(".movingPlatform")];
const coins=[...document.querySelectorAll(".coin")];
const pits=[...document.querySelectorAll(".pit")];

let enemyDir=enemies.map(()=>2);

let mp1Dir=2;
let mp2Dir=-2;

const scoreText=document.getElementById("score");
const timerText=document.getElementById("timer");

document.addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()]=true;

    if((gameOver||won) && e.key==="Enter"){
        location.reload();
    }

    startMusic();
});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

function overlap(a,b){
    return (
        a.left<b.right &&
        a.right>b.left &&
        a.top<b.bottom &&
        a.bottom>b.top
    );
}

const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
let musicStarted=false;

function beep(freq,time){

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.frequency.value=freq;
    osc.type="square";

    gain.gain.value=0.02;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();

    setTimeout(()=>{
        osc.stop();
    },time);
}

function startMusic(){

    if(musicStarted) return;

    musicStarted=true;

    const melody=[523,659,784,659,523,784];

    let i=0;

    setInterval(()=>{

        if(gameOver||won) return;

        beep(melody[i%melody.length],120);

        i++;

    },250);
}

function winMelody(){

    [523,659,784,1046,1318].forEach((n,i)=>{
        setTimeout(()=>beep(n,250),i*250);
    });
}

function loseMelody(){

    [700,600,500,350,200].forEach((n,i)=>{
        setTimeout(()=>beep(n,250),i*200);
    });
}

let timer=180;

setInterval(()=>{

    if(gameOver||won) return;

    timer--;

    timerText.textContent=timer;

    if(timer<=0){

        gameOver=true;

        loseMelody();

        message.style.display="block";
        message.innerHTML=
        "TIME UP<br><span style='font-size:24px'>Press ENTER</span>";
    }

},1000);

function update(){

    if(gameOver||won) return;

    let onGround=false;

    vx=0;

    if(keys["a"]) vx=-speed;
    if(keys["d"]) vx=speed;

    x+=vx;

    vy+=gravity;
    y+=vy;

    const floorY=window.innerHeight-130;

    if(y>=floorY){

        let inPit=false;

        pits.forEach(pit=>{

            const left=parseInt(pit.style.left);
            const right=left+pit.offsetWidth;

            if(x+20>left && x+20<right){
                inPit=true;
            }

        });

        if(inPit){

            gameOver=true;

            loseMelody();

            message.style.display="block";
            message.innerHTML=
            "FELL IN PIT<br><span style='font-size:24px'>Press ENTER</span>";

            return;
        }

        y=floorY;
        vy=0;
        onGround=true;
    }

    let oldX1=parseFloat(mp1.style.left);
    let oldX2=parseFloat(mp2.style.left);

    oldX1+=mp1Dir;
    oldX2+=mp2Dir;

    if(oldX1<1000 || oldX1>1300) mp1Dir*=-1;
    if(oldX2<1800 || oldX2>2200) mp2Dir*=-1;

    mp1.style.left=oldX1+"px";
    mp2.style.left=oldX2+"px";

    mario.style.left=x+"px";
    mario.style.top=y+"px";

    const marioRect=mario.getBoundingClientRect();

    [...platforms,...movingPlatforms].forEach(platform=>{

        const pRect=platform.getBoundingClientRect();

        if(overlap(marioRect,pRect) && vy>0){

            y=platform.offsetTop-50;

            vy=0;

            onGround=true;

            if(platform.id==="mp1") x+=mp1Dir;
            if(platform.id==="mp2") x+=mp2Dir;
        }

    });

    if(keys["w"] && onGround){
        vy=jumpPower;
    }

    mario.style.left=x+"px";
    mario.style.top=y+"px";

    coins.forEach(coin=>{

        if(coin.style.display==="none") return;

        if(overlap(
            mario.getBoundingClientRect(),
            coin.getBoundingClientRect()
        )){

            coin.style.display="none";

            score+=10;

            scoreText.textContent=score;
        }
    });

    enemies.forEach((enemy,index)=>{

        if(enemy.style.display==="none") return;

        let ex=parseFloat(enemy.style.left);

        ex+=enemyDir[index];

        if(ex<100 || ex>3000){
            enemyDir[index]*=-1;
        }

        enemy.style.left=ex+"px";

        if(overlap(
            mario.getBoundingClientRect(),
            enemy.getBoundingClientRect()
        )){

            const m=mario.getBoundingClientRect();
            const e=enemy.getBoundingClientRect();

            if(vy>0 && m.bottom<e.top+20){

                enemy.style.display="none";

                score+=25;

                scoreText.textContent=score;

                vy=-10;

            }else{

                gameOver=true;

                loseMelody();

                message.style.display="block";

                message.innerHTML=
                "GAME OVER<br><span style='font-size:24px'>Press ENTER</span>";
            }
        }

    });

    const castle=document.getElementById("castle");

    if(overlap(
        mario.getBoundingClientRect(),
        castle.getBoundingClientRect()
    )){

        won=true;

        winMelody();

        message.style.display="block";

        message.innerHTML=
        "YOU WIN!<br>Score: "+score+
        "<br><span style='font-size:24px'>Press ENTER</span>";
    }

    let cameraX=x-window.innerWidth/2;

    cameraX=Math.max(0,cameraX);
    cameraX=Math.min(3200-window.innerWidth,cameraX);

    world.style.transform=
        `translateX(${-cameraX}px)`;

    requestAnimationFrame(update);
}

update();

</script>

</body>
</html>
