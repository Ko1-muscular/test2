<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mario Game - Moving Platforms</title>

<style>
body{
    margin:0;
    background:#87CEEB;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#game{
    position:relative;
    width:1200px;
    height:600px;
    margin:20px auto;
    background:linear-gradient(#87CEEB 75%, #6dbb4f 75%);
    border:5px solid black;
    overflow:hidden;
}

#mario{
    position:absolute;
    width:40px;
    height:50px;
    background:red;
    border-radius:8px;
    z-index:10;
}

.platform{
    position:absolute;
    background:#8B4513;
}

.movingPlatform{
    position:absolute;
    background:#A0522D;
    border:3px solid #5C3317;
}

.coin{
    position:absolute;
    width:20px;
    height:20px;
    border-radius:50%;
    background:gold;
    border:2px solid orange;
}

.enemy{
    position:absolute;
    width:40px;
    height:40px;
    background:purple;
}

#ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:60px;
    background:#4CAF50;
}

.pit{
    position:absolute;
    bottom:0;
    height:60px;
    background:black;
}

#flagPole{
    position:absolute;
    left:1130px;
    bottom:60px;
    width:8px;
    height:220px;
    background:white;
}

#flag{
    position:absolute;
    width:60px;
    height:40px;
    background:pink;
    left:8px;
    top:10px;
    clip-path:polygon(0 0,100% 20%,100% 80%,0 100%);
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    font-size:24px;
    font-weight:bold;
}

#message{
    position:absolute;
    width:100%;
    top:220px;
    text-align:center;
    color:white;
    font-size:60px;
    text-shadow:3px 3px 5px black;
    display:none;
}
</style>
</head>

<body>

<div id="game">

<div id="ui">
Score: <span id="score">0</span>
&nbsp;&nbsp;&nbsp;
Time: <span id="timer">120</span>
</div>

<div id="message"></div>

<div id="mario"></div>

<div id="ground"></div>

<!-- Pits -->
<div class="pit" style="left:250px;width:120px;"></div>
<div class="pit" style="left:700px;width:120px;"></div>

<!-- Fixed Platforms -->
<div class="platform" style="left:150px;top:430px;width:120px;height:20px;"></div>
<div class="platform" style="left:600px;top:280px;width:120px;height:20px;"></div>
<div class="platform" style="left:980px;top:250px;width:120px;height:20px;"></div>

<!-- Moving Platforms -->
<div id="mp1" class="movingPlatform"
     style="left:350px;top:360px;width:140px;height:20px;"></div>

<div id="mp2" class="movingPlatform"
     style="left:820px;top:360px;width:140px;height:20px;"></div>

<!-- Coins -->
<div class="coin" style="left:180px;top:390px;"></div>
<div class="coin" style="left:220px;top:390px;"></div>
<div class="coin" style="left:430px;top:320px;"></div>
<div class="coin" style="left:470px;top:320px;"></div>
<div class="coin" style="left:630px;top:240px;"></div>
<div class="coin" style="left:670px;top:240px;"></div>
<div class="coin" style="left:860px;top:320px;"></div>
<div class="coin" style="left:900px;top:320px;"></div>
<div class="coin" style="left:1020px;top:210px;"></div>

<!-- Enemies -->
<div class="enemy" style="left:300px;top:500px;"></div>
<div class="enemy" style="left:500px;top:500px;"></div>
<div class="enemy" style="left:900px;top:500px;"></div>
<div class="enemy" style="left:1040px;top:210px;"></div>

<!-- Goal -->
<div id="flagPole">
<div id="flag"></div>
</div>

</div>

<script>

const mario=document.getElementById("mario");
const scoreText=document.getElementById("score");
const timerText=document.getElementById("timer");
const message=document.getElementById("message");

let x=40;
let y=500;
let vx=0;
let vy=0;

let score=0;
let gameOver=false;
let won=false;

const gravity=0.6;
const speed=5;
const jumpPower=-13;

const keys={};

const enemies=[...document.querySelectorAll(".enemy")];
const fixedPlatforms=[...document.querySelectorAll(".platform")];
const movingPlatforms=[...document.querySelectorAll(".movingPlatform")];
const pits=[...document.querySelectorAll(".pit")];
const coins=[...document.querySelectorAll(".coin")];

let enemyDirs=enemies.map(()=>2);

const mp1=document.getElementById("mp1");
const mp2=document.getElementById("mp2");

let mp1Dir=2;
let mp2Dir=-2;

let audioStarted=false;
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();

function beep(freq,duration){
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.frequency.value=freq;
    osc.type="square";

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    gain.gain.value=0.03;

    osc.start();

    setTimeout(()=>osc.stop(),duration);
}

function startBGM(){

    if(audioStarted) return;
    audioStarted=true;

    const melody=[523,659,784,659];
    let i=0;

    setInterval(()=>{

        if(gameOver||won) return;

        beep(melody[i%melody.length],150);
        i++;

    },300);
}

document.addEventListener("keydown",e=>{

    startBGM();

    keys[e.key.toLowerCase()]=true;

    if(e.key==="Enter" && (gameOver||won)){
        location.reload();
    }
});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

function overlap(a,b){
    return (
        a.left<b.right &&
        a.right>b.left &&
        a.top<b.bottom &&
        a.bottom>b.top
    );
}

function winMelody(){
    [523,659,784,1046].forEach((n,i)=>{
        setTimeout(()=>beep(n,250),i*250);
    });
}

function loseMelody(){
    [600,500,400,250].forEach((n,i)=>{
        setTimeout(()=>beep(n,300),i*250);
    });
}

let timeLeft=120;

setInterval(()=>{

    if(gameOver||won) return;

    timeLeft--;
    timerText.textContent=timeLeft;

    if(timeLeft<=0){

        gameOver=true;
        loseMelody();

        message.style.display="block";
        message.innerHTML=
        "TIME UP!<br><span style='font-size:24px'>Press ENTER</span>";
    }

},1000);

function updateMovingPlatforms(){

    let old1=parseFloat(mp1.style.left);
    let old2=parseFloat(mp2.style.left);

    old1 += mp1Dir;
    old2 += mp2Dir;

    if(old1<280 || old1>520) mp1Dir*=-1;
    if(old2<720 || old2>980) mp2Dir*=-1;

    mp1.style.left=old1+"px";
    mp2.style.left=old2+"px";
}

function update(){

    if(gameOver||won) return;

    updateMovingPlatforms();

    vx=0;

    if(keys["a"]) vx=-speed;
    if(keys["d"]) vx=speed;

    x+=vx;

    vy+=gravity;
    y+=vy;

    let onGround=false;

    if(y>=500){

        let overPit=false;

        pits.forEach(pit=>{

            const left=pit.offsetLeft;
            const right=left+pit.offsetWidth;

            if(x+20>left && x+20<right){
                overPit=true;
            }

        });

        if(overPit){

            gameOver=true;
            loseMelody();

            message.style.display="block";
            message.innerHTML=
            "FELL IN PIT!<br><span style='font-size:24px'>Press ENTER</span>";

            return;
        }

        y=500;
        vy=0;
        onGround=true;
    }

    mario.style.left=x+"px";
    mario.style.top=y+"px";

    const marioRect=mario.getBoundingClientRect();

    [...fixedPlatforms,...movingPlatforms].forEach(platform=>{

        const pRect=platform.getBoundingClientRect();

        if(overlap(marioRect,pRect) && vy>0){

            const previousBottom=(y-vy)+50;

            if(previousBottom <= platform.offsetTop+10){

                y=platform.offsetTop-50;
                vy=0;
                onGround=true;

                if(platform.classList.contains("movingPlatform")){

                    if(platform.id==="mp1"){
                        x+=mp1Dir;
                    }

                    if(platform.id==="mp2"){
                        x+=mp2Dir;
                    }
                }
            }
        }

    });

    if(keys["w"] && onGround){
        vy=jumpPower;
    }

    mario.style.left=x+"px";
    mario.style.top=y+"px";

    coins.forEach(coin=>{

        if(coin.style.display==="none") return;

        if(overlap(
            mario.getBoundingClientRect(),
            coin.getBoundingClientRect()
        )){
            coin.style.display="none";
            score+=10;
            scoreText.textContent=score;
        }
    });

    enemies.forEach((enemy,index)=>{

        if(enemy.style.display==="none") return;

        let pos=parseFloat(enemy.style.left);

        pos+=enemyDirs[index];

        if(pos<50 || pos>1100){
            enemyDirs[index]*=-1;
        }

        enemy.style.left=pos+"px";

        if(overlap(
            mario.getBoundingClientRect(),
            enemy.getBoundingClientRect()
        )){

            const m=mario.getBoundingClientRect();
            const e=enemy.getBoundingClientRect();

            if(vy>0 && m.bottom<e.top+20){

                enemy.style.display="none";

                vy=-10;

                score+=20;
                scoreText.textContent=score;

            }else{

                gameOver=true;

                loseMelody();

                message.style.display="block";
                message.innerHTML=
                "GAME OVER<br><span style='font-size:24px'>Press ENTER</span>";
            }
        }

    });

    const pole=document.getElementById("flagPole");

    if(overlap(
        mario.getBoundingClientRect(),
        pole.getBoundingClientRect()
    )){

        won=true;

        winMelody();

        message.style.display="block";
        message.innerHTML=
        "YOU WIN!<br>Score: "+score+
        "<br><span style='font-size:24px'>Press ENTER</span>";
    }

    requestAnimationFrame(update);
}

update();

</script>

</body>
</html>
